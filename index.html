<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Color Catch</title>
<style>
body { margin:0; background:#111; font-family:sans-serif; overflow:hidden; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh;}
canvas { background:#000; border:4px solid #fff; border-radius:12px; display:block; }
#flash { position:absolute; top:0; left:0; width:100%; height:100%; background:red; opacity:0; pointer-events:none; z-index:10; transition:0.2s;}
#gameOverOverlay, #menuOverlay, #instructionOverlay, #homeOverlay, #nameOverlay {
  position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; justify-content:center; align-items:center;
  background: rgba(0,0,0,0.85); z-index:20; text-align:center; color:#fff;
}
#gameOverOverlay h1, #homeOverlay h1, #nameOverlay h1 { font-size:60px; color:#ff004c; margin-bottom:20px;}
button {
  margin:12px; padding:15px 50px; font-size:22px; border:none; border-radius:12px;
  background:#007bff; color:#fff; cursor:pointer; transition:0.2s;
}
button:hover { transform:scale(1.1); }
#menuBtn { 
  position:absolute; top:10px; right:10px; width:40px; height:30px; z-index:25; cursor:pointer; 
  display:none; /* ⚡ Default hidden */ 
  flex-direction:column; justify-content:space-between; 
}
#menuBtn div { height:5px; background:white; border-radius:2px; }

/* Name input styling */
#playerNameInput {
  padding:12px 16px; font-size:20px; border-radius:10px; border:2px solid #fff; outline:none; width:280px; text-align:center; background:#222; color:#fff;
}
#nameOverlay p { margin:8px 0 16px; font-size:18px; color:#ddd; }

/* Title effect */
.titleWrap { width:84vw; max-width:900px; height:clamp(100px, 18vh, 180px); margin-bottom:20px; }
.titleCanvas { width:100%; height:100%; display:block; background:transparent; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="flash"></div>
<div id="menuBtn"><div></div><div></div><div></div></div>

<!-- Name (first-time) Overlay -->
<div id="nameOverlay">
  <div class="titleWrap"><canvas id="titleCanvasName" class="titleCanvas"></canvas></div>
  <p>Enter your name to begin</p>
  <input id="playerNameInput" type="text" maxlength="20" placeholder="Your name" />
  <button id="saveNameBtn">Continue</button>
</div>

<!-- Home Overlay -->
<div id="homeOverlay">
  <div class="titleWrap"><canvas id="titleCanvasHome" class="titleCanvas"></canvas></div>
  <button id="playBtn">Play</button>
  <button id="homeInstructionBtn">Instructions</button>
  <button id="homeScoreBtn">Scores</button>
</div>

<!-- Game Over Screen -->
<div id="gameOverOverlay">
  <h1>GAME OVER</h1>
  <div id="finalScore">Score: 0</div>
  <button id="restartBtn">Restart</button>
  <button id="homeBtn">Home</button>
  <button id="scoreBtn">Scores</button>
</div>

<!-- Menu Overlay -->
<div id="menuOverlay">
  <button id="resumeBtn">Resume</button>
  <button id="menuRestartBtn">Restart</button>
  <button id="menuHomeBtn">Home</button>
  <button id="instructionBtn">Instructions</button>
</div>

<!-- Instructions Overlay -->
<div id="instructionOverlay">
  <h2>Instructions</h2>
  <p>
    Catch balls of the <b>same color</b> as the basket. First catch sets the basket color.<br>
    Wrong catch or missed target color reduces a life.<br>
    Game Over after 3 mistakes.<br>
    <b>Mobile:</b> Drag to move<br>
    <b>PC:</b> Arrow keys or A/D, Mouse moves basket, P = Pause
  </p>
  <button onclick="closeInstruction()">Back</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let basket={x:200,y:0,w:80,h:20,color:"white"};
let balls=[];
let colors=["red","blue","green","yellow"];
let targetColor=null, score=0, lives=3, speed=2, gameOver=false;
let paused=false, countdownActive=false, gameStarted=false;
let lastScores=JSON.parse(localStorage.getItem("lastScores"))||[];
let bestScore=parseInt(localStorage.getItem("bestScore"))||0;
let nextGoldenThreshold=50; // Golden ball at 50, 100, 150, ...
let speedModifierFactor=1; // temporary slowdowns multiply base speed
let speedModifierUntil=0; // timestamp (ms) until which modifier is active

// Audio
let pointSound=new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let mistakeSound=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg");
let gameOverSound=new Audio("https://www.soundjay.com/misc/sounds/fail-trombone-01.mp3");

// Flash
const flashDiv=document.getElementById("flash");
function flashScreen(){ flashDiv.style.opacity=0.6; setTimeout(()=>flashDiv.style.opacity=0,200); if(navigator.vibrate) navigator.vibrate(200); }

// Title Effect: outline text "Color Catch" with balls visible only inside text
class TitleEffect {
  constructor(canvasEl){
    this.canvas=canvasEl; this.ctx=this.canvas.getContext('2d');
    this.text='Color Catch';
    this.particles=[]; this.running=false; this.raf=0;
    this.colors=["#ff004c","#00d1ff","#22ff66","#ffe600","#ff7b00"]; // vibrant
    this.resize();
    window.addEventListener('resize', ()=>{ if(this.running){ this.resize(); }});
  }
  resize(){
    const rect=this.canvas.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    this.canvas.width=Math.max(1,Math.floor(rect.width*dpr));
    this.canvas.height=Math.max(1,Math.floor(rect.height*dpr));
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.width=rect.width; this.height=rect.height;
    this.prepareTextMask();
    this.initParticles();
  }
  prepareTextMask(){
    const ctx=this.ctx; const w=this.width; const h=this.height;
    ctx.clearRect(0,0,w,h);
    // Build path for text
    ctx.save();
    // Auto-size font to fit width with margins
    const maxH=Math.floor(h*0.7);
    let fontSize=maxH;
    ctx.font=`${fontSize}px Impact, system-ui, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const margin=w*0.06;
    // Decrease font until width fits within (w - 2*margin)
    while(fontSize>20 && ctx.measureText(this.text).width > (w - 2*margin)){
      fontSize-=2; ctx.font=`${fontSize}px Impact, system-ui, sans-serif`;
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    this.textX=w/2; this.textY=h/2 + h*0.05; // slight optical adjust
    this.textStrokeWidth=Math.max(3, Math.floor(fontSize*0.12));
    // Create path for clipping
    const p=new Path2D();
    p.addPath(this.textPath(this.text, this.textX, this.textY));
    this.textPathObj=p;
    ctx.restore();
  }
  textPath(txt, x, y){
    // Canvas doesn't provide path directly from text; use strokeText/fillText with clip
    // We'll store only the position; actual clip uses fillText on the fly
    const p=new Path2D();
    p.rect(0,0,0,0); // placeholder
    p._x=x; p._y=y; p._txt=txt;
    return p;
  }
  initParticles(){
    const count=Math.max(140, Math.floor(this.width*this.height/650));
    this.particles=Array.from({length:count}).map(()=>({
      x:Math.random()*this.width,
      y:Math.random()*this.height,
      r:Math.random()*5+3,
      vx:(Math.random()*1.5+0.3)*(Math.random()<0.5?-1:1),
      vy:(Math.random()*1.5+0.3)*(Math.random()<0.5?-1:1),
      c:this.colors[(Math.random()*this.colors.length)|0]
    }));
  }
  step(){
    const ctx=this.ctx; const w=this.width; const h=this.height;
    ctx.clearRect(0,0,w,h);
    // Clip to text interior
    ctx.save();
    ctx.beginPath();
    // Use same sizing as prepared
    // Recompute size similarly to avoid drift
    const maxH=Math.floor(h*0.7);
    let fontSize=maxH; ctx.font=`${fontSize}px Impact, system-ui, sans-serif`;
    const margin=w*0.06; while(fontSize>20 && ctx.measureText(this.text).width > (w - 2*margin)) { fontSize-=2; ctx.font=`${fontSize}px Impact, system-ui, sans-serif`; }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#000';
    ctx.rect(0,0,w,h); // ensure path context
    ctx.clip();
    // Use globalCompositeOperation with text as destination-in mask
    // First draw particles background
    for(const p of this.particles){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<p.r||p.x>w-p.r) p.vx*=-1;
      if(p.y<p.r||p.y>h-p.r) p.vy*=-1;
      ctx.beginPath();
      ctx.fillStyle=p.c;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }
    // Mask with text interior
    ctx.globalCompositeOperation='destination-in';
    ctx.fillStyle='#fff';
    ctx.fillText(this.text, this.textX, this.textY);
    ctx.restore();
    // Draw text outline on top
    ctx.save();
    let fontSize2=Math.floor(h*0.7); ctx.font=`${fontSize2}px Impact, system-ui, sans-serif`;
    const margin2=w*0.06; while(fontSize2>20 && ctx.measureText(this.text).width > (w - 2*margin2)) { fontSize2-=2; ctx.font=`${fontSize2}px Impact, system-ui, sans-serif`; }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=Math.max(3, Math.floor(fontSize2*0.12));
    ctx.strokeStyle='#ffffff';
    ctx.shadowColor='rgba(255,255,255,0.25)';
    ctx.shadowBlur=ctx.lineWidth*0.6;
    ctx.strokeText(this.text, this.textX, this.textY);
    ctx.restore();
    if(this.running) this.raf=requestAnimationFrame(()=>this.step());
  }
  start(){ if(this.running) return; this.running=true; this.resize(); this.step(); }
  stop(){ this.running=false; if(this.raf) cancelAnimationFrame(this.raf); }
}

// Instantiate for Name and Home overlays
let titleFxName=null, titleFxHome=null;

// 9:16 canvas resize
function resizeCanvas(){
    let w=window.innerWidth, h=window.innerHeight;
    let ratio=9/16;
    if(w/h>ratio){ canvas.height=h; canvas.width=h*ratio; }
    else{ canvas.width=w; canvas.height=w/ratio; }
    canvas.style.position="absolute";
    canvas.style.left=(window.innerWidth-canvas.width)/2+"px";
    canvas.style.top=(window.innerHeight-canvas.height)/2+"px";
    basket.y=canvas.height-100;
    clampBasket();
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function clampBasket(){ 
    if(basket.x<0) basket.x=0;
    if(basket.x+basket.w>canvas.width) basket.x=canvas.width-basket.w;
}

// Draw
function drawBasket(){ ctx.fillStyle=basket.color; ctx.fillRect(basket.x,basket.y,basket.w,basket.h);} 
function drawBalls(){
    balls.forEach(b=>{
        ctx.save();
        if(b.special==='gold'){
            const r=12;
            const gradient=ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,r);
            gradient.addColorStop(0,'#fff7a8');
            gradient.addColorStop(0.6,'#ffd700');
            gradient.addColorStop(1,'#b8860b');
            ctx.shadowColor='rgba(255,215,0,0.8)';
            ctx.shadowBlur=20;
            ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2);
            ctx.fillStyle=gradient; ctx.fill();
        } else {
            ctx.beginPath();ctx.arc(b.x,b.y,10,0,Math.PI*2); ctx.fillStyle=b.color; ctx.fill();
        }
        ctx.restore();
    });
}
function spawnBall(){ balls.push({x:Math.random()*(canvas.width-20)+10,y:0,color:colors[Math.floor(Math.random()*colors.length)], special:null}); }
function spawnGoldenBall(){
    const x=Math.random()*(canvas.width-24)+12;
    balls.push({x:x,y:0,color:'#ffd700', special:'gold'});
}
function drawHUD(){ ctx.fillStyle="white"; ctx.font="16px Arial"; ctx.fillText("Score: "+score,10,20); ctx.fillText("Lives: "+lives,10,40); ctx.fillText("Target: "+(targetColor||"None"),10,60); }

// Game Over
const gameOverOverlay=document.getElementById("gameOverOverlay");
function showGameOver(){
    gameOver=true;
    gameOverOverlay.style.display="flex";
    document.getElementById("finalScore").innerText="Score: "+score;
    gameOverSound.play();
    lastScores.unshift(score); if(lastScores.length>5) lastScores.pop(); 
    if(score>bestScore) bestScore=score;
    localStorage.setItem("lastScores",JSON.stringify(lastScores));
    localStorage.setItem("bestScore",bestScore);
}

function checkGoldenSpawn(){
    while(score>=nextGoldenThreshold){
        spawnGoldenBall();
        nextGoldenThreshold+=50;
    }
}

// Update
function updateBalls(){
    for(let b of balls) b.y+=speed;
    for(let i=balls.length-1;i>=0;i--){
        let b=balls[i];
        if(b.y+10>=basket.y && b.y-10<=basket.y+basket.h && b.x+10>=basket.x && b.x-10<=basket.x+basket.w){
            if(b.special==='gold'){
                // Random effect: +1 life OR slow speed by 15% for 6s OR +10 points
                const roll=Math.random();
                if(roll<0.34){
                    lives++;
                } else if(roll<0.67){
                    speedModifierFactor*=0.85; // slow 15%
                    speedModifierUntil=performance.now()+6000; // 6 seconds
                } else {
                    score+=10;
                    checkGoldenSpawn();
                }
                pointSound.play();
            } else if(!targetColor){ targetColor=b.color; basket.color=b.color; score++; pointSound.play(); checkGoldenSpawn(); }
            else if(b.color===targetColor){ score++; pointSound.play(); checkGoldenSpawn(); }
            else { lives--; mistakeSound.play(); flashScreen(); }
            balls.splice(i,1);
        } else if(b.y>canvas.height){ 
            if(targetColor!==null && b.color===targetColor){ lives--; mistakeSound.play(); flashScreen(); } 
            balls.splice(i,1);
        }
    }
    // +10% speed every 10 points (compounded from base speed 2), times temporary modifier
    if(speedModifierUntil && performance.now()>speedModifierUntil){ speedModifierFactor=1; speedModifierUntil=0; }
    speed=2*Math.pow(1.10,Math.floor(score/10))*speedModifierFactor;
    if(lives<=0 && !gameOver) showGameOver();
}

// Countdown
function startCountdown(callback){
    countdownActive = true;
    let count = 3;
    const overlay = document.createElement('div');
    overlay.style.position = 'absolute';
    overlay.style.top='0'; overlay.style.left='0';
    overlay.style.width='100%'; overlay.style.height='100%';
    overlay.style.display='flex'; overlay.style.justifyContent='center'; overlay.style.alignItems='center';
    overlay.style.background='rgba(0,0,0,0.6)'; overlay.style.color='white'; overlay.style.fontSize='80px'; overlay.style.zIndex='50';
    overlay.innerText=count;
    document.body.appendChild(overlay);
    const interval = setInterval(()=>{
        count--;
        if(count>0){ overlay.innerText=count; }
        else{
            clearInterval(interval);
            document.body.removeChild(overlay);
            countdownActive=false;
            if(callback) callback();
        }
    },1000);
}

// Loop
function gameLoop(){ 
    if(gameStarted && !gameOver && !paused && !countdownActive){ 
        ctx.clearRect(0,0,canvas.width,canvas.height); 
        if(Math.random()<0.02) spawnBall(); 
        updateBalls(); drawBasket(); drawBalls(); drawHUD();
    }
    requestAnimationFrame(gameLoop);
}

// Reset game
function resetGame(){ 
    score=0; lives=3; targetColor=null; basket.color="white"; balls=[]; speed=2; gameOver=false; paused=true; nextGoldenThreshold=50; speedModifierFactor=1; speedModifierUntil=0;
    drawBasket(); drawHUD(); 
}

// Controls
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft"||e.key==="a") basket.x-=20; 
    if(e.key==="ArrowRight"||e.key==="d") basket.x+=20; 
    clampBasket();
    if(e.key.toLowerCase()==="p" && gameStarted && !gameOver){ 
        paused=!paused;
        if(!paused) startCountdown(()=>{ paused=false; });
    }
});
canvas.addEventListener("mousemove",e=>{ basket.x=e.offsetX-basket.w/2; clampBasket(); });

// Touch
let touchX=null;
canvas.addEventListener("touchstart",e=>{ touchX=e.touches[0].clientX; });
canvas.addEventListener("touchmove",e=>{
    let dx=e.touches[0].clientX-touchX; basket.x+=dx; touchX=e.touches[0].clientX; clampBasket();
});

// Menu
const menuBtn=document.getElementById("menuBtn");
const menuOverlay=document.getElementById("menuOverlay");
menuBtn.onclick=()=>{ paused=true; menuOverlay.style.display="flex"; };
document.getElementById("resumeBtn").onclick=()=>{ menuOverlay.style.display="none"; startCountdown(()=>{ paused=false; }); };
document.getElementById("menuRestartBtn").onclick=()=>{ menuOverlay.style.display="none"; gameOverOverlay.style.display="none"; resetGame(); startCountdown(()=>{ paused=false; gameStarted=true; }); };
document.getElementById("menuHomeBtn").onclick=()=>{ location.reload(); };
document.getElementById("instructionBtn").onclick=()=>{ menuOverlay.style.display="none"; document.getElementById("instructionOverlay").style.display="flex"; };
function closeInstruction(){ document.getElementById("instructionOverlay").style.display="none"; menuOverlay.style.display="flex"; }

// Game Over buttons
document.getElementById("restartBtn").onclick=()=>{ gameOverOverlay.style.display="none"; resetGame(); startCountdown(()=>{ paused=false; gameStarted=true; }); };
document.getElementById("homeBtn").onclick=()=>{ location.reload(); };
document.getElementById("scoreBtn").onclick=()=>{ alert(`Best Score: ${bestScore}\nLast 5 Games:\n${lastScores.map((s,i)=>i+1+". "+s).join("\n")}`); };

// Home Screen buttons
function showHome(){
  document.getElementById("homeOverlay").style.display="flex";
  // Start home title effect when visible
  const homeCanvas=document.getElementById('titleCanvasHome');
  if(homeCanvas){
    if(!titleFxHome) titleFxHome=new TitleEffect(homeCanvas);
    titleFxHome.start();
  }
}

document.getElementById("playBtn").onclick=()=>{ 
    document.getElementById("homeOverlay").style.display="none"; 
    menuBtn.style.display="flex"; // ⚡ Game start hone ke baad menu show hoga
    if(titleFxHome) titleFxHome.stop();
    resetGame(); 
    startCountdown(()=>{ paused=false; gameStarted=true; gameLoop(); }); 
};
document.getElementById("homeInstructionBtn").onclick=()=>{ 
    document.getElementById("homeOverlay").style.display="none"; 
    if(titleFxHome) titleFxHome.stop();
    document.getElementById("instructionOverlay").style.display="flex"; 
};
document.getElementById("homeScoreBtn").onclick=()=>{ 
    alert(`Best Score: ${bestScore}\nLast 5 Games:\n${lastScores.map((s,i)=>i+1+". "+s).join("\n")}`); 
};

// Name overlay logic (show once until storage cleared)
const saveNameBtn=document.getElementById("saveNameBtn");
const playerNameInput=document.getElementById("playerNameInput");
function savePlayerName(){
  const name=(playerNameInput.value||"").trim();
  if(!name){ alert("Please enter your name."); return; }
  localStorage.setItem("playerName", name);
  document.getElementById("nameOverlay").style.display="none";
  if(titleFxName) titleFxName.stop();
  showHome();
}
saveNameBtn.onclick=savePlayerName;
playerNameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') savePlayerName(); });

// Start
const storedName=localStorage.getItem("playerName");
if(storedName){
  showHome();
} else {
  const nameOv=document.getElementById("nameOverlay");
  nameOv.style.display="flex";
  const nameCanvas=document.getElementById('titleCanvasName');
  if(nameCanvas){
    if(!titleFxName) titleFxName=new TitleEffect(nameCanvas);
    titleFxName.start();
  }
}
</script>
</body>
</html>
